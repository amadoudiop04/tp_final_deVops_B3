name: CD — ShopLite

on:
  push:
    branches: ["Dev"]   # → staging
    tags: ["v*"]        # → production
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1 : Build et tag des images Docker
  # Lie le tag Git (ex: v1.0.0) aux images Docker du même nom.
  # Produit : shoplite-api:v1.0.0 + shoplite-api:latest
  # ─────────────────────────────────────────────────────────────────
  build-images:
    name: "Build & tag images Docker"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extraire les métadonnées du tag Git
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME:-dev}"           >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)"     >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: "Build shoplite-api — :latest et :${{ steps.meta.outputs.version }}"
        run: |
          docker build \
            --build-arg BUILD_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg GIT_SHA="${{ steps.meta.outputs.git_sha }}" \
            --build-arg BUILD_DATE="${{ steps.meta.outputs.build_date }}" \
            -t shoplite-api:latest \
            -t shoplite-api:${{ steps.meta.outputs.version }} \
            ./api

      - name: "Build shoplite-frontend — :latest et :${{ steps.meta.outputs.version }}"
        run: |
          docker build \
            --build-arg BUILD_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg GIT_SHA="${{ steps.meta.outputs.git_sha }}" \
            --build-arg BUILD_DATE="${{ steps.meta.outputs.build_date }}" \
            -t shoplite-frontend:latest \
            -t shoplite-frontend:${{ steps.meta.outputs.version }} \
            ./frontend

      - name: "Historique local des images (docker images)"
        run: docker images | grep shoplite

      - name: "Inspecter shoplite-api:${{ steps.meta.outputs.version }}"
        run: |
          docker inspect shoplite-api:${{ steps.meta.outputs.version }} \
            --format 'Title={{index .Config.Labels "org.opencontainers.image.title"}} Version={{index .Config.Labels "org.opencontainers.image.version"}} SHA={{index .Config.Labels "org.opencontainers.image.revision"}} Created={{index .Config.Labels "org.opencontainers.image.created"}} Cmd={{.Config.Cmd}}'

      - name: "Comparer shoplite-api:latest vs :${{ steps.meta.outputs.version }}"
        run: |
          echo "--- shoplite-api:latest ---"
          docker images shoplite-api:latest \
            --format "ID={{.ID}}  Size={{.Size}}  Created={{.CreatedAt}}"
          echo "--- shoplite-api:${{ steps.meta.outputs.version }} ---"
          docker images shoplite-api:${{ steps.meta.outputs.version }} \
            --format "ID={{.ID}}  Size={{.Size}}  Created={{.CreatedAt}}"

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 : Staging
  # ─────────────────────────────────────────────────────────────────
  deploy-staging:
    name: "Déploiement staging"
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/Dev'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Build staging avec version
        run: |
          APP_VERSION=${{ needs.build-images.outputs.version }} \
          GIT_SHA=$(git rev-parse --short HEAD) \
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          docker compose -f docker-compose.yml -f docker-compose.staging.yml build

      - name: Smoke test staging
        run: echo "Staging OK — version ${{ needs.build-images.outputs.version }}"

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 : Production (uniquement sur tag v*)
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: "Déploiement production"
    runs-on: ubuntu-latest
    needs: build-images
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build production avec version
        run: |
          APP_VERSION=${{ needs.build-images.outputs.version }} \
          GIT_SHA=$(git rev-parse --short HEAD) \
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          docker compose build

      - name: Simulate deploy
        run: echo "Production déployée — version ${{ needs.build-images.outputs.version }}"
