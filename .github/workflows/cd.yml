name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build staging
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml build
      - name: Smoke test staging
        run: echo "Staging OK — version ${{ github.ref_name }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build production
        run: docker compose build
      - name: Simulate deploy
        run: echo "Production déployée — version ${{ github.ref_name }}"
