name: CI — ShopLite

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Qualité du code (lint + formatage)
  # Bloque la CI si le code ne respecte pas les
  # règles ESLint ou le formatage Prettier.
  # ─────────────────────────────────────────────
  qualite:
    name: "Qualité (lint + format)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: "Prettier — vérifier le formatage"
        run: npm run format:check

      - name: "ESLint — vérifier la qualité du code"
        run: npm run lint:ci

  # ─────────────────────────────────────────────
  # JOB 2 : Tests unitaires + couverture ≥ 80 %
  # Pas de vraie DB requise (mock jest).
  # ─────────────────────────────────────────────
  tests-unitaires:
    name: "Tests unitaires (coverage ≥ 80%)"
    runs-on: ubuntu-latest
    needs: qualite
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: "Jest — tests unitaires avec couverture"
        run: npm run test:coverage

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: api/coverage/lcov.info

  # ─────────────────────────────────────────────
  # JOB 3 : Tests d'intégration (vraie DB)
  # + Démonstration du cycle incident/rollback
  #
  # MOMENT CLÉ :
  #   Étape 1 → test passe  (DB saine)
  #   Étape 2 → incident simulé (DROP TABLE)
  #   Étape 3 → test échoue  (DB dégradée) ✓ attendu
  #   Étape 4 → rollback (init.sql)
  #   Étape 5 → test repasse (DB restaurée)
  # ─────────────────────────────────────────────
  tests-integration:
    name: "Tests d'intégration (vraie DB + cycle incident)"
    runs-on: ubuntu-latest
    needs: qualite

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shoplite
          POSTGRES_PASSWORD: shoplite_password
          POSTGRES_DB: shoplite
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://shoplite:shoplite_password@localhost:5432/shoplite

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Initialiser la base de données
        run: |
          PGPASSWORD=shoplite_password psql \
            -h localhost -U shoplite -d shoplite \
            -f ../database/init.sql

      # ── AVANT INCIDENT ──────────────────────────
      - name: "[AVANT INCIDENT] Test /products — attendu PASS ✅"
        run: npm run test:integration

      # ── SIMULATION INCIDENT ─────────────────────
      - name: "[INCIDENT] Supprimer la table products (simulation panne DB)"
        run: |
          PGPASSWORD=shoplite_password psql \
            -h localhost -U shoplite -d shoplite \
            -c "DROP TABLE products;"

      - name: "[PENDANT INCIDENT] Test /products — attendu FAIL ❌"
        id: test_incident
        run: npm run test:integration
        continue-on-error: true

      - name: "[PENDANT INCIDENT] Vérifier que le test a bien échoué"
        if: steps.test_incident.outcome == 'success'
        run: |
          echo "ERREUR : le test aurait dû échouer pendant l'incident mais il a réussi."
          exit 1

      # ── ROLLBACK ────────────────────────────────
      - name: "[ROLLBACK] Restaurer la base de données via init.sql"
        run: |
          PGPASSWORD=shoplite_password psql \
            -h localhost -U shoplite -d shoplite \
            -f ../database/init.sql

      - name: "[APRÈS ROLLBACK] Test /products — attendu PASS ✅"
        run: npm run test:integration

  # ─────────────────────────────────────────────
  # JOB 4 : Audit de sécurité npm
  # ─────────────────────────────────────────────
  audit:
    name: "Audit de sécurité (npm audit)"
    runs-on: ubuntu-latest
    needs: qualite
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: "npm audit — détecter les vulnérabilités"
        run: npm audit --audit-level=high
